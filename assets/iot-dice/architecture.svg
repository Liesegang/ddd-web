<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">IoT Diceの構成</title>
  <desc id="desc">BNO085の計測値をnRF5340からBluetooth Low EnergyでWebブラウザへ送り、Three.jsで姿勢を表示し、Rapierで出目を予測する構成図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1726"/>
      <stop offset="1" stop-color="#152a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5de4c7"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#050a10" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7aa2f7"/>
    </marker>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; }
      .label { fill: #9db0c5; font-size: 22px; font-weight: 600; letter-spacing: 0.08em; }
      .card-title { fill: #f3f7fb; font-size: 34px; font-weight: 700; }
      .card-body { fill: #b9c7d6; font-size: 22px; }
      .state { fill: #dce7f2; font-size: 22px; font-weight: 700; }
      .small { fill: #8fa4b9; font-size: 19px; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <circle cx="1445" cy="95" r="230" fill="#7aa2f7" opacity="0.08"/>
  <circle cx="90" cy="860" r="280" fill="#5de4c7" opacity="0.06"/>

  <text x="90" y="105" fill="#f6f9fc" font-size="56" font-weight="800">IoT Dice</text>
  <rect x="90" y="128" width="390" height="6" rx="3" fill="url(#accent)"/>
  <text x="90" y="175" class="label">実測した投擲状態からの出目予測に向けたプロトタイプ</text>
  <rect x="1270" y="70" width="240" height="62" rx="31" fill="#2b4055" stroke="#f2b66d" stroke-width="2"/>
  <text x="1390" y="110" fill="#ffd6a3" font-size="24" font-weight="700" text-anchor="middle">開発中</text>

  <g filter="url(#shadow)">
    <rect x="90" y="240" width="310" height="250" rx="28" fill="#17283a" stroke="#31506b" stroke-width="2"/>
    <rect x="455" y="240" width="310" height="250" rx="28" fill="#17283a" stroke="#31506b" stroke-width="2"/>
    <rect x="820" y="240" width="260" height="250" rx="28" fill="#17283a" stroke="#31506b" stroke-width="2"/>
    <rect x="1135" y="240" width="375" height="250" rx="28" fill="#17283a" stroke="#31506b" stroke-width="2"/>
  </g>

  <text x="125" y="290" class="label">MOTION SENSOR</text>
  <text x="125" y="350" class="card-title">BNO085</text>
  <text x="125" y="402" class="card-body">姿勢</text>
  <text x="125" y="438" class="card-body">角速度</text>
  <text x="125" y="474" class="card-body">線形加速度</text>

  <text x="490" y="290" class="label">ON DEVICE</text>
  <text x="490" y="350" class="card-title">nRF5340</text>
  <text x="490" y="402" class="card-body">4状態を判定</text>
  <text x="490" y="438" class="card-body">並進速度を積分</text>
  <text x="490" y="474" class="small">衝撃の3サンプル前を保持</text>

  <text x="855" y="290" class="label">WIRELESS</text>
  <text x="855" y="350" class="card-title">BLE</text>
  <text x="855" y="402" class="card-body">姿勢 約60 Hz</text>
  <text x="855" y="438" class="card-body">衝撃を即時通知</text>

  <text x="1170" y="290" class="label">WEB BROWSER</text>
  <text x="1170" y="350" class="card-title">Three.js + Rapier</text>
  <text x="1170" y="402" class="card-body">3D姿勢表示</text>
  <text x="1170" y="438" class="card-body">32通りの着地を計算</text>
  <text x="1170" y="474" class="small">確率分布と実際の出目を記録</text>

  <path d="M 405 365 H 440" stroke="#7aa2f7" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 770 365 H 805" stroke="#7aa2f7" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1085 365 H 1120" stroke="#7aa2f7" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="90" y="575" class="label">THROW STATE</text>
  <g filter="url(#shadow)">
    <rect x="90" y="610" width="250" height="100" rx="50" fill="#1b3545" stroke="#5de4c7" stroke-width="2"/>
    <rect x="390" y="610" width="250" height="100" rx="50" fill="#1b3545" stroke="#5de4c7" stroke-width="2"/>
    <rect x="690" y="610" width="250" height="100" rx="50" fill="#1b3545" stroke="#5de4c7" stroke-width="2"/>
    <rect x="990" y="610" width="250" height="100" rx="50" fill="#1b3545" stroke="#5de4c7" stroke-width="2"/>
    <rect x="1290" y="610" width="220" height="100" rx="50" fill="#27435a" stroke="#7aa2f7" stroke-width="2"/>
  </g>
  <text x="215" y="672" class="state" text-anchor="middle">静止</text>
  <text x="515" y="672" class="state" text-anchor="middle">移動</text>
  <text x="815" y="672" class="state" text-anchor="middle">自由落下</text>
  <text x="1115" y="672" class="state" text-anchor="middle">転がり</text>
  <text x="1400" y="672" class="state" text-anchor="middle">出目確定</text>
  <path d="M 345 660 H 375" stroke="#5de4c7" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 645 660 H 675" stroke="#5de4c7" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 945 660 H 975" stroke="#5de4c7" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1245 660 H 1275" stroke="#7aa2f7" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="90" y="775" width="1420" height="70" rx="20" fill="#101f2d" stroke="#294258" stroke-width="2"/>
  <text x="130" y="820" class="card-body">姿勢共有</text>
  <circle cx="340" cy="811" r="5" fill="#5de4c7"/>
  <text x="380" y="820" class="card-body">六面の確率分布</text>
  <circle cx="680" cy="811" r="5" fill="#5de4c7"/>
  <text x="720" y="820" class="card-body">的中判定</text>
  <circle cx="930" cy="811" r="5" fill="#5de4c7"/>
  <text x="970" y="820" class="card-body">投擲記録をJSONで書き出し</text>
</svg>
